<app-header></app-header>

<div class="p-4 ml-72">
  <div class="bg-white shadow-lg rounded-lg p-4 max-w-4xl mx-auto mt-2">
    <h2 class="text-2xl font-semibold text-gray-800 text-center mb-4">Classement du Joueur</h2>

    <!-- Erro ou Carregando -->
    <ng-template #erroOuCarregando>
      <div class="bg-white/50 backdrop-blur-sm shadow-md p-4 max-w-md w-full text-center mt-4">
        <p class="text-red-500 font-semibold" *ngIf="erro">{{ erro }}</p>
        <p class="text-gray-800" *ngIf="!erro">Chargement du classement...</p>
      </div>
    </ng-template>

    <!-- Ranking -->
    <div *ngIf="ranking.length > 0; else erroOuCarregando" class="mt-6 overflow-x-auto">
      <table class="min-w-full bg-white border border-gray-300 shadow-md rounded-lg">
        <thead class="bg-gray-100 text-gray-700">
          <tr>
            <th rowspan="2" class="px-4 py-2 text-left border-b align-bottom">Personnage</th>
            <th rowspan="2" class="px-4 py-2 text-left border-b align-bottom">Position</th>
            <th colspan="3" class="px-4 py-2 text-left border-b">Sceaux Environnements </th>
            <th rowspan="2" class="px-4 py-2 text-left border-b align-bottom">Médailles</th>
          </tr>
          <tr>
            <th class="px-4 py-1 text-left border-b text-sm font-semibold">Maison</th>
            <th class="px-4 py-1 text-left border-b text-sm font-semibold">Place</th>
            <th class="px-4 py-1 text-left border-b text-sm font-semibold">Université</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let jogador of ranking" class="hover:bg-gray-50 transition">
            <td class="px-4 py-2 border-b">{{ jogador.personagem || '—' }}</td>
            <td class="px-4 py-2 border-b">{{ jogador.posicao }}</td>
            <td class="px-4 py-2 border-b">{{ jogador.seloCasa }}</td>
            <td class="px-4 py-2 border-b">{{ jogador.seloParque }}</td>
            <td class="px-4 py-2 border-b">{{ jogador.seloUniversidade }}</td>
            <td class="px-4 py-2 border-b">{{ jogador.medalha }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
