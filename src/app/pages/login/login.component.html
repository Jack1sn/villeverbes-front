<app-header> </app-header>

<ng-template #content let-modal>
  <!-- Modal content -->
</ng-template>

<div class="login-background relative " *ngIf="mostrarLogin"> 
  
  <button 
  (click)="fecharLogin()" 
  class="absolute top-4 right-4 text-xl font-bold cursor-pointer" 
  style="color: black;">
    × 
  </button>

  <div class="flex items-center justify-center flex-grow ">
    <div class="login-container">
      <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
      <form #loginForm="ngForm" (ngSubmit)="realizarLogin(loginForm)">
        <div class="mb-4">
          <label for="email" class="block mb-2">E-mail</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            #emailField="ngModel"
            class="border p-2 rounded w-full"
          />
          <div *ngIf="emailField.invalid && emailField.touched" class="text-red-500 text-sm">
            Insira um e-mail válido.
          </div>
        </div>
      
        <div class="mb-4">
          <label for="senha" class="block mb-2">Senha</label>
          <input
            type="password"
            id="senha"
            [(ngModel)]="senha"
            name="senha"
            required
            #senhaField="ngModel"
            class="border p-2 rounded w-full"
          />
          <div *ngIf="senhaField.invalid && senhaField.touched" class="text-red-500 text-sm">
            A senha é obrigatória.
          </div>
        </div>
      
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="bg-blue-500 text-white rounded px-4 py-2 hover:bg-blue-600 w-full"
        >
          Entrar
        </button>
      </form>
      <!-- Alerta de sucesso -->
<div *ngIf="successMessage" class="mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative text-center">
  {{ successMessage }}
</div>

<!-- Alerta de erro -->
<div *ngIf="errorMessage" class="mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-center">
  {{ errorMessage }}
</div>

    </div>
  </div>
</div>
