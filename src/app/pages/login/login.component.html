<!-- HEADER (fora do modal) -->
<app-header></app-header>



<!-- LOGIN MODAL -->
<div *ngIf="mostrarLogin" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="relative bg-white rounded-lg shadow-lg w-full max-w-md p-6">
    
    <!-- Botão fechar (X) -->
    <button
      (click)="fecharLogin()"
      class="absolute top-4 right-4 text-2xl font-bold text-gray-600 hover:text-black cursor-pointer z-10"
      aria-label="Fechar login"
    >
      &times;
    </button>

    <!-- Título -->
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

    <!-- FORMULÁRIO -->
    <form (ngSubmit)="realizarLogin(1)">
      <!-- E-mail -->
      <div class="mb-4">
        <label for="email" class="block mb-1 font-medium">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          class="border border-gray-300 rounded p-2 w-full focus:outline-none focus:ring focus:border-blue-500"
        />
      </div>

      <!-- Senha -->
      <div class="mb-4">
        <label for="senha" class="block mb-1 font-medium">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="senha"
          required
          class="border border-gray-300 rounded p-2 w-full focus:outline-none focus:ring focus:border-blue-500"
        />
      </div>

      <!-- Botão Entrar -->
      <button
        type="submit"
        class="bg-blue-600 text-white font-semibold rounded py-2 px-4 w-full hover:bg-blue-700 transition"
      >
        Entrar
      </button>

      <!-- Link de cadastro -->
      <p class="mt-4 text-center text-sm">
        Não tem uma conta?
        <a routerLink="/autocadastro" class="text-blue-600 hover:underline">Cadastre-se</a>
      </p>

      <!-- Alerta de sucesso -->
      <div
        *ngIf="successMessage"
        class="mt-4 bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded flex items-center"
        role="alert"
      >
        <svg class="w-5 h-5 mr-2 fill-current" viewBox="0 0 20 20">
          <path d="M9 12l2 2 4-4M9 17a8 8 0 100-16 8 8 0 000 16z" />
        </svg>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Alerta de erro -->
      <div
        *ngIf="errorMessage"
        class="mt-4 bg-red-100 border border-red-400 text-red-800 px-4 py-3 rounded flex items-center"
        role="alert"
      >
        <svg class="w-5 h-5 mr-2 fill-current" viewBox="0 0 20 20">
          <path d="M10 15l-1.5-1.5L10 12l1.5 1.5L10 15zm-1-9h2v5h-2V6z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </form>
  </div>
</div>
