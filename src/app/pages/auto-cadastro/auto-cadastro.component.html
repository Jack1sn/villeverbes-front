<app-header></app-header>
<div class="autocadastro-background fixed inset-0 z-0">
  <ng-template #content let-modal>
    <div class="modal-header animate-fadeIn transition-opacity duration-300">
      <h4 class="modal-title text-title font-nunito">Mensagem</h4>
      <button
        type="button"
        class="btn-close text-title"
        aria-label="Close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>
    <div class="modal-body animate-fadeIn">
      <div
        *ngIf="errorMessage"
        class="text-red-500 p-4 bg-red-100 border border-red-400 rounded animate-fadeIn"
      >
        {{ errorMessage }}
      </div>
      <div
        *ngIf="successMessage"
        class="text-green-500 p-4 bg-green-100 border border-green-400 rounded animate-fadeIn"
      >
        {{ successMessage }}
      </div>
    </div>
    <div class="modal-footer animate-fadeIn">
      <button
        type="button"
        class="flex rounded-full cursor-pointer font-semibold select-none text-white py-2 px-6 no-underline bg-button hover:bg-button/80 transition-colors"
        (click)="modal.close('Close click')"
      >
        Fechar
      </button>
    </div>
  </ng-template>

  <head>
    <meta charset="utf-8" />
    <title>Ville des Verbes | AutoCadastro</title>
  </head>

  <div
    class="flex flex-col min-w-[100vw] w-full min-h-screen overflow-x-hidden items-center justify-start gap-10"
  >
    <h2><strong> Cadastro</strong></h2>

    <div class="bg-white border border-divider rounded-lg shadow p-8">
      <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar(content)">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">CPF:</label>
            <input
              formControlName="cpf"
              type="text"
              class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
              placeholder="Digite seu CPF"
              mask="000.000.000-00"
              [dropSpecialCharacters]="false"
            />
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Nome Completo:</label>
            <input
              formControlName="nome"
              type="text"
              class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
              placeholder="Digite seu Nome Completo"
            />
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">E-mail:</label>
            <input
              formControlName="email"
              type="email"
              class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
              placeholder="Digite seu E-mail"
            />
          </div>

          <div formGroupName="endereco">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">CEP:</label>
              <input
                formControlName="cep"
                (input)="buscarEndereco()"
                type="text"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                placeholder="Digite seu CEP"
              />
            </div>
          </div>

          <div formGroupName="endereco">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">Logradouro:</label>
              <input
                formControlName="logradouro"
                type="text"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                placeholder="Logradouro"
              />
            </div>
          </div>

          <div formGroupName="endereco">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">Complemento:</label>
              <input
                formControlName="complemento"
                type="text"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                placeholder="Complemento"
              />
            </div>
          </div>

          <div formGroupName="endereco">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">Bairro:</label>
              <input
                formControlName="bairro"
                type="text"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                placeholder="Bairro"
              />
            </div>
          </div>

          <div formGroupName="endereco">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">Localidade:</label>
              <input
                formControlName="localidade"
                type="text"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                placeholder="Localidade"
              />
            </div>
          </div>

          <div formGroupName="endereco">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">UF:</label>
              <input
                formControlName="uf"
                type="text"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                placeholder="UF"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Telefone:</label>
            <input
              formControlName="telefone"
              type="text"
              class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
              placeholder="Digite seu Telefone"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-500 text-white font-semibold rounded-md py-2 hover:bg-blue-600 mt-4"
        >
          Cadastrar
        </button>
      </form>
   <!-- MENSAGEM DE SUCESSO -->
<div
  *ngIf="successMessage"
  class="text-green-600 bg-green-100 border border-green-400 rounded p-4 flex items-center gap-2"
>
  <i class="fas fa-check-circle text-green-500"></i>
  <span>{{ successMessage }}</span>
</div>

<!-- MENSAGEM DE ERRO -->
<div
  *ngIf="errorMessage"
  class="text-red-600 bg-red-100 border border-red-400 rounded p-4 flex items-center gap-2"
>
  <i class="fas fa-exclamation-circle text-red-500"></i>
  <span>{{ errorMessage }}</span>
</div>

    </div>
  </div>
</div>
