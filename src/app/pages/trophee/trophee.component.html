<app-header></app-header>

<div class="min-h-screen w-screen bg-gray-50 flex flex-col">
  <div class="flex-grow w-full px-72 py-5">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
      Trophées Remportés
    </h1>

    <div *ngIf="userId" class="overflow-x-auto">
      <table class="min-w-full border border-gray-300 text-center">
        <thead class="bg-gray-100 text-gray-700 uppercase text-sm">
          <tr>
            <th class="border px-6 py-3">Sceaux  Environnements </th>
            <th class="border px-6 py-3">Quantités</th>
            <th class="border px-6 py-3">Médailles</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of trofeus" class="hover:bg-gray-50">
            <!-- Etiqueta colorida + nome do selo -->
            <td class="border px-6 py-2">
              <div class="flex items-center justify-center gap-2">
                <!-- Etiqueta redonda colorida -->
                <div
                  class="w-8 h-8 shadow-md selo-zigzag"
                  [ngClass]="{
                    'bg-yellow-900': item.selo === 'Maison',
                    'bg-blue-600': item.selo === 'Place',
                    'bg-yellow-400': item.selo === 'Université'
                  }"
                  title="Selo {{ item.selo }}"
                ></div>

                <!-- Nome do ambiente -->
                <span class="font-medium text-gray-800">{{ item.selo }}</span>
              </div>
            </td>

            <!-- Valor (quantidade de selos) -->
            <td
              class="border px-6 py-2 text-lg font-semibold text-gray-800 cursor-pointer select-none"
              (click)="incrementar(item)"
              title="Clique para incrementar"
            >
              {{ item.value }}
            </td>

            <!-- Medalha na primeira linha -->
            <td
              class="border px-6 py-2"
              *ngIf="trofeus.indexOf(item) === 0"
              [attr.rowspan]="trofeus.length"
            >
              <div *ngIf="mostrarMedalha" class="flex flex-col items-center gap-1">
                <div
                  class="w-14 h-14 rounded-full bg-gradient-to-b from-yellow-400 to-yellow-600 shadow-md flex items-center justify-center text-white text-3xl font-bold"
                  title="Medalha"
                >
                  🥇
                </div>
                <span class="text-sm text-gray-600 font-semibold">
                  Médailles: {{ medalhaValor }}
                </span>
              </div>
              <div *ngIf="!mostrarMedalha" class="text-gray-400 italic text-sm">
                Incomplète
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
