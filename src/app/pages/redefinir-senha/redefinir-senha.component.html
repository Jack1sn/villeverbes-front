<app-header></app-header>

<!-- Centralização total -->
<div class="min-h-screen w-screen bg-gray-50 flex flex-col"> 
  <div class="w-full max-w-md bg-white p-8  ml-96 mt-10 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Redefinir Senha</h2>

    <form (ngSubmit)="redefinirSenha()" #form="ngForm" novalidate>

      <!-- E-mail -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">E-mail</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Digite seu e-mail" />
      </div>

      <!-- Senha atual -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">Senha atual (temporária)</label>
        <input
          type="password"
          [(ngModel)]="senhaAtual"
          name="senhaAtual"
          required
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Senha temporária" />
      </div>

      <!-- Nova senha -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">Nova senha</label>
        <input
          type="password"
          [(ngModel)]="novaSenha"
          name="novaSenha"
          required
          minlength="6"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Nova senha" />
      </div>

      <!-- Confirmar nova senha -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1">Confirmar nova senha</label>
        <input
          type="password"
          [(ngModel)]="confirmarSenha"
          name="confirmarSenha"
          required
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Confirme a nova senha" />
      </div>

      <!-- Mensagem de erro -->
      <div *ngIf="erro" class="text-red-600 text-sm mb-4 text-center">
        {{ erro }}
      </div>

      <!-- Botão -->
      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-300">
        Redefinir Senha
      </button>
    </form>
  </div>
</div>
